name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_BASE: /mine-slope-compliance/
      # vite-plugin-cesium 在绝对 base 下会把 cesium 资源放到 dist/<base>/cesium/
      # 这里把嵌套目录展平到 dist 根，使 URL /mine-slope-compliance/cesium/* 能命中
      - run: |
          if [ -d "dist/mine-slope-compliance/cesium" ]; then
            rm -rf dist/cesium
            mv dist/mine-slope-compliance/cesium dist/cesium
            rm -rf dist/mine-slope-compliance
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
